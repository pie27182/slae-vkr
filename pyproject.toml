[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slae-vkr"
version = "2.0.0"
description = "Исследование методов решения систем линейных уравнений"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "threadpoolctl>=3.1",
  "psutil>=5.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["slae*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
